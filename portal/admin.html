<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Desk Admin | CarbonXFuture</title>
<link rel="icon" href="/favicon.ico" sizes="48x48"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--forest:#1A4A2E;--forest-light:#2D6B45;--forest-pale:#EAF2EC;--slate-50:#F5F5F3;--slate-100:#E8E8E4;--slate-200:#C8C8C2;--slate-400:#8A8A82;--slate-600:#4A4A45;--slate-800:#1E1E1A;--amber:#B8740A;--amber-pale:#FDF3E3;}
body{font-family:'Inter',sans-serif;color:var(--slate-800);font-size:14px;line-height:1.6;background:var(--slate-50);min-height:100vh;}
.topbar{background:var(--slate-800);padding:12px 1.5rem;display:flex;justify-content:space-between;align-items:center;}
.topbar .brand{color:#fff;font-size:13px;font-weight:500;text-decoration:none;}
.topbar button{background:rgba(255,255,255,0.12);color:#fff;border:none;border-radius:7px;padding:7px 14px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;}
.wrap{max-width:1100px;margin:0 auto;padding:2.5rem 1.5rem 4rem;}
h1{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:400;margin-bottom:1.5rem;}
h2{font-size:1rem;font-weight:600;margin-bottom:0.75rem;}
.card{background:#fff;border:0.5px solid var(--slate-100);border-radius:14px;padding:1.5rem;margin-bottom:1.5rem;overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:700px;}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:0.5px;color:var(--slate-400);padding:8px 10px;border-bottom:1px solid var(--slate-100);}
td{padding:9px 10px;border-bottom:0.5px solid var(--slate-100);vertical-align:middle;}
.pill{font-size:10.5px;font-weight:600;padding:3px 10px;border-radius:100px;text-transform:uppercase;}
.pill.pending,.pill.submitted{background:var(--amber-pale);color:var(--amber);}
.pill.approved,.pill.validated,.pill.published{background:var(--forest-pale);color:var(--forest);}
.pill.sold,.pill.won{background:var(--forest);color:#fff;}
.pill.new{background:var(--amber-pale);color:var(--amber);}
.pill.rejected,.pill.suspended{background:#FBEAEA;color:#A33;}
button.act{border:none;border-radius:7px;padding:6px 13px;font-size:12px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;margin:2px;}
.ok{background:var(--forest);color:#fff;}
.warn{background:var(--amber-pale);color:var(--amber);}
.bad{background:#FBEAEA;color:#A33;}
.ghost{background:var(--slate-100);color:var(--slate-600);}
.muted{color:var(--slate-400);font-size:12px;}
a{color:var(--forest-light);}
.denied{max-width:480px;margin:5rem auto;text-align:center;}
/* Desk suite: subnav, inbox, collapsible cards, search, notes modal */
.subnav{position:sticky;top:0;z-index:40;background:rgba(245,245,243,0.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--slate-100);margin:0 -1.5rem 1.25rem;padding:9px 1.5rem;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.subnav a{font-size:11.5px;color:var(--slate-600);text-decoration:none;padding:5px 11px;border-radius:100px;border:0.5px solid var(--slate-200);background:#fff;white-space:nowrap;}
.subnav a:hover{border-color:var(--forest-light);color:var(--forest);}
.subnav a b{color:var(--forest);}
.subnav input{flex:1;min-width:180px;padding:7px 12px;border:0.5px solid var(--slate-200);border-radius:100px;font-family:'Inter',sans-serif;font-size:12.5px;outline:none;}
#searchResults{position:absolute;top:100%;left:1.5rem;right:1.5rem;background:#fff;border:0.5px solid var(--slate-200);border-radius:0 0 12px 12px;box-shadow:0 12px 30px rgba(0,0,0,0.1);max-height:320px;overflow-y:auto;display:none;}
#searchResults div{padding:9px 16px;font-size:12.5px;cursor:pointer;border-bottom:0.5px solid var(--slate-100);}
#searchResults div:hover{background:var(--forest-pale);}
#searchResults .k{font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--slate-400);margin-right:8px;}
.inbox{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.25rem;}
.inbox .chip{display:flex;align-items:center;gap:8px;background:#fff;border:0.5px solid var(--slate-100);border-radius:12px;padding:10px 16px;font-size:12.5px;cursor:pointer;}
.inbox .chip b{font-size:1.15rem;color:var(--amber);}
.inbox .chip.zero b{color:var(--slate-200);}
.inbox .chip.zero{opacity:0.65;cursor:default;}
.card h2{cursor:pointer;user-select:none;}
.card h2::before{content:"▾";display:inline-block;margin-right:8px;color:var(--slate-400);transition:transform 0.15s;}
.card.collapsed h2::before{transform:rotate(-90deg);}
.card.collapsed > *:not(h2){display:none;}
.card.flash{outline:2px solid var(--forest-light);outline-offset:2px;}
#notesModal{display:none;position:fixed;inset:0;background:rgba(20,20,18,0.5);z-index:60;align-items:center;justify-content:center;padding:1.5rem;}
#notesModal .box{background:#fff;border-radius:14px;max-width:520px;width:100%;max-height:80vh;overflow-y:auto;padding:1.5rem;}
#notesModal textarea{width:100%;border:0.5px solid var(--slate-200);border-radius:8px;padding:10px;font-family:'Inter',sans-serif;font-size:13px;resize:vertical;}
#profileModal{display:none;position:fixed;inset:0;background:rgba(20,20,18,0.5);z-index:60;align-items:center;justify-content:center;padding:1.5rem;}
#profileModal .box{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:85vh;overflow-y:auto;padding:1.5rem;}
#profileModal label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:0.5px;color:var(--slate-400);margin:10px 0 3px;}
#profileModal input,#profileModal textarea{width:100%;border:0.5px solid var(--slate-200);border-radius:8px;padding:9px 11px;font-family:'Inter',sans-serif;font-size:13px;box-sizing:border-box;}
#profileModal .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}
.noteItem{border-left:2px solid var(--forest-pale);padding:6px 12px;margin-bottom:8px;font-size:12.5px;}
.week label{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13px;cursor:pointer;}
.week input{accent-color:var(--forest);width:15px;height:15px;}
.week .auto{font-size:10.5px;color:var(--forest-light);border:0.5px solid var(--forest-pale);border-radius:100px;padding:1px 8px;}
</style>
</head>
<body>
<div class="topbar">
  <a class="brand" href="/">⬡ CarbonXFuture · Desk Admin</a>
  <div><a href="/" style="color:#fff;font-size:12px;margin-right:12px;">← Website</a><button onclick="signOut()">Sign out</button></div>
</div>
<div class="wrap" id="app"><p class="muted" style="text-align:center;margin-top:4rem;">Loading…</p></div>

<div id="notesModal"><div class="box">
  <h2 style="margin-bottom:0.25rem;" id="nmTitle">Notes</h2>
  <p class="muted" id="nmSub" style="margin-bottom:1rem;">Private desk notes — never visible to the member.</p>
  <div id="nmList" class="muted">Loading…</div>
  <textarea id="nmText" rows="3" placeholder="Add a note — e.g. 'Called 07-30, sending W-9, follow up Friday'…" style="margin-top:0.75rem;"></textarea>
  <div style="display:flex;justify-content:space-between;margin-top:0.75rem;">
    <button class="act ghost" onclick="closeNotes()">Close</button>
    <button class="act ok" onclick="saveNote()">Save note</button>
  </div>
</div></div>

<div id="profileModal"><div class="box">
  <h2 style="margin-bottom:0.25rem;" id="pfTitle">Member profile</h2>
  <p class="muted" style="margin-bottom:0.5rem;">Full CRM contact card — visible to the desk only. <span id="pfEmail" style="color:var(--forest);"></span></p>
  <div class="grid2">
    <div><label>Contact name</label><input id="pf_contact_name"/></div>
    <div><label>Company</label><input id="pf_company"/></div>
    <div><label>Phone</label><input id="pf_phone" placeholder="+1 954 …"/></div>
    <div><label>Website</label><input id="pf_website" placeholder="https://…"/></div>
    <div><label>Country</label><input id="pf_country" placeholder="USA"/></div>
    <div><label>City / State</label><input id="pf_city" placeholder="Fort Lauderdale, FL"/></div>
    <div><label>Source</label><input id="pf_source" placeholder="e.g. website KYC form, referral, LinkedIn"/></div>
    <div><label>Tags</label><input id="pf_tags" placeholder="e.g. hot lead, collector, FL"/></div>
  </div>
  <label>Address</label><textarea id="pf_address" rows="2"></textarea>
  <div style="display:flex;justify-content:space-between;margin-top:1rem;">
    <button class="act ghost" onclick="closeProfile()">Close</button>
    <div>
      <button class="act ghost" id="pfNotesBtn">Notes</button>
      <button class="act ok" onclick="saveProfile()">Save profile</button>
    </div>
  </div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/portal/config.js"></script>
<script>
const db = supabase.createClient(CXF_SUPABASE_URL, CXF_SUPABASE_KEY);
let USER = null;
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

async function signOut(){ await db.auth.signOut(); location.href='/portal/'; }
async function audit(action, target){ try { await db.from('audit_log').insert({actor: USER.email, action, target}); } catch(e){} }

async function notifyMember(type, to, data) {
  try {
    const { data: s } = await db.auth.getSession();
    const res = await fetch('/api/notify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + s.session.access_token },
      body: JSON.stringify({ type, to, data })
    });
    if (!res.ok) throw new Error((await res.json()).error || ('HTTP ' + res.status));
    return true;
  } catch (e) {
    alert('Action saved, but the notification email failed (' + e.message + ') — please email the member manually from desk@carbonxfuture.com.');
    return false;
  }
}

(async function init(){
  const { data } = await db.auth.getSession();
  if (!data.session) { location.href = '/portal/'; return; }
  USER = data.session.user;
  if (!CXF_ADMIN_EMAILS.includes(USER.email.toLowerCase())) {
    document.getElementById('app').innerHTML = '<div class="denied"><h1>Not authorized</h1><p class="muted">This area is reserved for the CarbonXFuture desk.</p></div>';
    return;
  }
  document.getElementById('app').innerHTML = `
    <h1>Desk Admin</h1>
    <div class="subnav" style="position:sticky;">
      <a href="#c-rfqs" onclick="jumpTo(event,'c-rfqs')">RFQ <b id="n-rfqs"></b></a>
      <a href="#c-members" onclick="jumpTo(event,'c-members')">Members <b id="n-members"></b></a>
      <a href="#c-crm" onclick="jumpTo(event,'c-crm')">CRM</a>
      <a href="#c-subs" onclick="jumpTo(event,'c-subs')">Subscribers <b id="n-subs"></b></a>
      <a href="#c-reports" onclick="jumpTo(event,'c-reports')">Reports <b id="n-reports"></b></a>
      <a href="#c-oil" onclick="jumpTo(event,'c-oil')">Feedstock <b id="n-oil"></b></a>
      <a href="#c-registry" onclick="jumpTo(event,'c-registry')">Registry</a>
      <a href="#c-certs" onclick="jumpTo(event,'c-certs')">Certificates</a>
      <a href="#c-projects" onclick="jumpTo(event,'c-projects')">Projects</a>
      <a href="#c-news" onclick="jumpTo(event,'c-news')">Newsletter</a>
      <a href="#c-backup" onclick="jumpTo(event,'c-backup')">Backup</a>
      <a href="#c-audit" onclick="jumpTo(event,'c-audit')">Log</a>
      <input id="gSearch" placeholder="Search everything — member, email, serial, RFQ…" oninput="globalSearch(this.value)" onblur="setTimeout(()=>{document.getElementById('searchResults').style.display='none';},250)"/>
      <div id="searchResults"></div>
    </div>
    <div class="inbox" id="inbox"></div>
    <div class="card week" id="c-week"><h2>This week — desk routine</h2><div id="week" class="muted">Loading…</div></div>
    <div id="overview" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:1.5rem;"></div>
    <div class="card" id="c-rfqs"><h2>RFQ desk — quote requests</h2>
      <input placeholder="Filter…" oninput="filterCard('rfqs', this.value)" style="padding:7px 12px;border:0.5px solid var(--slate-200);border-radius:7px;font-family:'Inter',sans-serif;font-size:12px;margin-bottom:8px;width:220px;"/>
      <button class="act ghost" onclick="exportCardCSV('rfqs','cxf-rfqs')" style="float:right;">Export CSV</button>
      <div id="rfqs" class="muted">Loading…</div></div>
    <div class="card" id="c-members"><h2>Members</h2>
      <input placeholder="Filter…" oninput="filterCard('members', this.value)" style="padding:7px 12px;border:0.5px solid var(--slate-200);border-radius:7px;font-family:'Inter',sans-serif;font-size:12px;margin-bottom:8px;width:220px;"/>
      <button class="act ghost" onclick="exportCardCSV('members','cxf-members')" style="float:right;">Export CSV</button>
      <div id="members" class="muted">Loading…</div></div>
    <div class="card" id="c-crm"><h2>CRM — member contact book</h2>
      <p class="muted" style="margin-bottom:0.75rem;">Full contact profile for every member — phone, location, source, tags and desk notes. Click <b>Profile</b> to view/edit. (Extra fields require running <code>schema-crm.sql</code> once in Supabase.)</p>
      <input placeholder="Filter…" oninput="filterCard('crm', this.value)" style="padding:7px 12px;border:0.5px solid var(--slate-200);border-radius:7px;font-family:'Inter',sans-serif;font-size:12px;margin-bottom:8px;width:220px;"/>
      <button class="act ghost" onclick="exportCardCSV('crm','cxf-crm')" style="float:right;">Export CSV</button>
      <div id="crm" class="muted">Loading…</div></div>
    <div class="card" id="c-reports"><h2>Reports awaiting validation</h2><div id="reports" class="muted">Loading…</div></div>
    <div class="card" id="c-docs"><h2>Documents</h2><div id="docs" class="muted">Loading…</div></div>
    <div class="card" id="c-oil"><h2>Feedstock — waste-oil listings (Oil Desk)</h2>
      <p class="muted" style="margin-bottom:0.75rem;">Member listings of physical waste oil. Approve to publish on the public Oil Desk; buyers respond through the RFQ desk.</p>
      <div id="oillistings" class="muted">Loading…</div></div>
    <div class="card" id="c-market"><h2>Marketplace — live on the website</h2>
      <p class="muted" style="margin-bottom:0.75rem;">Everything currently visible in the public marketplace, from all three sources.</p>
      <div id="listings" class="muted">Loading…</div></div>
    <div class="card" id="c-registry"><h2>CXF Registry — serialized units</h2>
      <p class="muted" style="margin-bottom:0.75rem;">Issue serialized unit batches — <b>only from a validated report</b> (Registry Rules §2). One report backs at most one batch. Serial, project label, vintage, quantity and status are <b>public</b> on /registry.html — owner and evidence stay private. Use a generic project label if the member wants confidentiality.</p>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px;">
        <select id="ruMember" onchange="loadIssuableReports()" style="padding:8px;border:0.5px solid var(--slate-200);border-radius:7px;font-family:'Inter',sans-serif;font-size:12.5px;"><option value="">— owner (member) —</option></select>
        <select id="ruReport" onchange="prefillFromReport()" style="padding:8px;border:0.5px solid var(--slate-200);border-radius:7px;font-family:'Inter',sans-serif;font-size:12.5px;"><option value="">— validated report (required) —</option></select>
        <input id="ruLabel" placeholder="Public project label (e.g. Florida collector #003)" style="padding:8px;border:0.5px solid var(--slate-200);border-radius:7px;font-family:'Inter',sans-serif;font-size:12.5px;"/>
        <select id="ruCode" style="padding:8px;border:0.5px solid var(--slate-200);border-radius:7px;font-family:'Inter',sans-serif;font-size:12.5px;">
          <option>CXF-CO</option><option>CXF-RR</option><option>CXF-FC</option>
        </select>
        <input id="ruVintage" placeholder="Vintage (e.g. 2026-07)" style="padding:8px;border:0.5px solid var(--slate-200);border-radius:7px;font-family:'Inter',sans-serif;font-size:12.5px;"/>
        <input id="ruQty" type="number" min="0.1" step="0.1" placeholder="Quantity (tCO₂e)" style="padding:8px;border:0.5px solid var(--slate-200);border-radius:7px;font-family:'Inter',sans-serif;font-size:12.5px;"/>
      </div>
      <button class="act ok" onclick="issueUnits()">Issue batch</button>
      <div id="registryList" class="muted" style="margin-top:1rem;">Loading…</div>
    </div>
    <div class="card" id="c-certs"><h2>Retirement certificates</h2>
      <p class="muted" style="margin-bottom:0.75rem;">Issue a numbered certificate when credits are retired for a buyer. Serials are public and verifiable at /verify.html — never put private data in these fields.</p>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px;">
        <input id="ctBuyer" placeholder="Retired for (e.g. Acme Corp — or 'Confidential')" style="padding:8px;border:0.5px solid var(--slate-200);border-radius:7px;font-family:'Inter',sans-serif;font-size:12.5px;"/>
        <input id="ctProject" placeholder="Project (e.g. World Trade Petroleum — Re-Refinery)" style="padding:8px;border:0.5px solid var(--slate-200);border-radius:7px;font-family:'Inter',sans-serif;font-size:12.5px;"/>
        <input id="ctVolume" type="number" min="1" placeholder="Volume (tCO₂e)" style="padding:8px;border:0.5px solid var(--slate-200);border-radius:7px;font-family:'Inter',sans-serif;font-size:12.5px;"/>
        <input id="ctVintage" placeholder="Vintage (e.g. 2026)" style="padding:8px;border:0.5px solid var(--slate-200);border-radius:7px;font-family:'Inter',sans-serif;font-size:12.5px;"/>
        <input id="ctDate" type="date" style="padding:8px;border:0.5px solid var(--slate-200);border-radius:7px;font-family:'Inter',sans-serif;font-size:12.5px;"/>
        <input id="ctEmail" type="email" placeholder="Buyer email for the certificate (optional)" style="padding:8px;border:0.5px solid var(--slate-200);border-radius:7px;font-family:'Inter',sans-serif;font-size:12.5px;"/>
      </div>
      <button class="act ok" onclick="issueCertificate()">Issue certificate</button>
      <div id="certs" class="muted" style="margin-top:1rem;">Loading…</div>
    </div>
    <div class="card" id="c-projects"><h2>Public projects — website Project Explorer</h2>
      <p class="muted" style="margin-bottom:0.75rem;">Publish a validated member project to the public Project Explorer page (shown with the ⬡ CXF badge).</p>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px;">
        <select id="pjMember" style="padding:8px;border:0.5px solid var(--slate-200);border-radius:7px;font-family:'Inter',sans-serif;font-size:12.5px;"><option value="">— member (optional) —</option></select>
        <input id="pjName" placeholder="Project name" style="padding:8px;border:0.5px solid var(--slate-200);border-radius:7px;font-family:'Inter',sans-serif;font-size:12.5px;"/>
        <input id="pjCountry" placeholder="Country / State" value="Florida, USA" style="padding:8px;border:0.5px solid var(--slate-200);border-radius:7px;font-family:'Inter',sans-serif;font-size:12.5px;"/>
        <input id="pjType" placeholder="Type" value="Waste oil re-refining" style="padding:8px;border:0.5px solid var(--slate-200);border-radius:7px;font-family:'Inter',sans-serif;font-size:12.5px;"/>
        <input id="pjVintages" placeholder="Vintages (e.g. 2027–2036)" style="padding:8px;border:0.5px solid var(--slate-200);border-radius:7px;font-family:'Inter',sans-serif;font-size:12.5px;"/>
        <input id="pjSize" placeholder="Indicative size (e.g. ~425k tCO₂e/yr, pre-operational)" style="padding:8px;border:0.5px solid var(--slate-200);border-radius:7px;font-family:'Inter',sans-serif;font-size:12.5px;"/>
        <input id="pjAnnual" type="number" min="0" placeholder="Annual volume (tCO₂e/yr, e.g. 425000)" oninput="pjCalc()" style="padding:8px;border:0.5px solid var(--slate-200);border-radius:7px;font-family:'Inter',sans-serif;font-size:12.5px;"/>
        <input id="pjPrice" type="number" min="0" step="0.01" placeholder="Indicative price ($/tCO₂e, e.g. 21.50)" oninput="pjCalc()" style="padding:8px;border:0.5px solid var(--slate-200);border-radius:7px;font-family:'Inter',sans-serif;font-size:12.5px;"/>
        <input id="pjYears" type="number" min="1" max="30" placeholder="Term (years, e.g. 10)" oninput="pjCalc()" style="padding:8px;border:0.5px solid var(--slate-200);border-radius:7px;font-family:'Inter',sans-serif;font-size:12.5px;"/>
      </div>
      <p class="muted" style="margin-bottom:8px;">Total project value: <b id="pjTotal" style="color:var(--forest);">—</b> <span id="pjTotalDetail"></span> · leave the three value fields empty if you don't want the project shown in the marketplace.</p>
      <button class="act ok" onclick="publishProject()">Publish to website</button>
      <div id="cxfprojects" class="muted" style="margin-top:1rem;">Loading…</div>
    </div>
    <div class="card" id="c-backup"><h2>Backup</h2>
      <p class="muted" style="margin-bottom:0.75rem;">Downloads every table (members, reports, listings, RFQs, certificates, price history, subscribers, audit log) as one JSON file. Keep weekly copies in a safe folder. <span id="bkReminder" style="color:var(--amber);font-weight:600;"></span></p>
      <button class="act ok" id="bkBtn" onclick="downloadBackup()">Download full backup (JSON)</button>
      <span id="bkStatus" class="muted" style="margin-left:10px;"></span>
      <p class="muted" style="margin-top:0.5rem;">Note: uploaded PDF files live in Supabase Storage and are not inside this JSON — download important documents from the Documents card.</p>
    </div>

function jumpTo(e, id){
  e.preventDefault();
  const c = document.getElementById(id);
  if (!c) return;
  c.classList.remove('collapsed');
  c.scrollIntoView({behavior:'smooth', block:'start'});
  c.classList.add('flash'); setTimeout(() => c.classList.remove('flash'), 1600);
}
function toggleCard(id){
  const c = document.getElementById(id);
  c.classList.toggle('collapsed');
  try { localStorage.setItem('cxf_col_' + id, c.classList.contains('collapsed') ? '1' : '0'); } catch(e){}
}
function wireCollapse(){
  document.querySelectorAll('.card').forEach(c => {
    const h = c.querySelector('h2');
    if (!h) return;
    h.addEventListener('click', () => toggleCard(c.id));
    try { if (localStorage.getItem('cxf_col_' + c.id) === '1') c.classList.add('collapsed'); } catch(e){}
  });
}

function isoWeek(){
  const d = new Date(); const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y = new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return t.getUTCFullYear() + '-W' + String(Math.ceil((((t - y) / 86400000) + 1) / 7)).padStart(2,'0');
}
function weekStartISO(){
  const d = new Date(); const day = d.getDay() || 7;
  d.setDate(d.getDate() - day + 1);
  return d.toISOString().slice(0,10);
}
async function loadWeek(){
  const el = document.getElementById('week');
  const wk = isoWeek(); const start = weekStartISO();
  let pricesOk = false, snapOk = false, backupOk = false;
  try { const p = await (await fetch('/prices.json', {cache:'no-store'})).json(); pricesOk = (p.lastUpdated || '') >= start; } catch(e){}
  try { const { data } = await db.from('price_history').select('date').gte('date', start).limit(1); snapOk = !!(data && data.length); } catch(e){}
  try { const last = parseInt(localStorage.getItem('cxf_last_backup') || '0'); backupOk = Date.now() - last < 7 * 86400000; } catch(e){}
  const manual = key => { try { return localStorage.getItem('cxf_wk_' + wk + '_' + key) === '1'; } catch(e){ return false; } };
  const row = (done, label, auto, key) => `
    <label><input type="checkbox" ${done ? 'checked' : ''} ${auto ? 'disabled' : `onchange="try{localStorage.setItem('cxf_wk_${wk}_${key}', this.checked ? '1' : '0');}catch(e){}"`}/>
    <span style="${done ? 'color:var(--slate-400);text-decoration:line-through;' : ''}">${label}</span>${auto ? '<span class="auto">auto</span>' : ''}</label>`;
  el.innerHTML =
    row(pricesOk, 'Update weekly marks — prices.json uploaded', true) +
    row(snapOk, 'Price snapshot captured to history', true) +
    row(manual('desknote'), 'Send the Monday Desk Note to subscribers', false, 'desknote') +
    row(backupOk, 'Weekly backup downloaded', true) +
    `<p class="muted" style="margin-top:6px;">Week ${wk} — auto items tick themselves; the checklist resets every Monday.</p>`;
}

/* ---------- CXF Registry (serialized units) ---------- */
async function nextBatchSerial(){
  const year = new Date().getFullYear();
  const { data } = await db.from('registry_units').select('serial').like('serial', 'CXF-B-' + year + '-%').order('serial',{ascending:false}).limit(1);
  const last = data && data[0] ? parseInt(data[0].serial.split('-')[3]) || 0 : 0;
  return 'CXF-B-' + year + '-' + String(last + 1).padStart(4, '0');
}
const ACTIVITY_CODE = { collection: 'CXF-CO', collection_rerefining: 'CXF-RR', full_chain: 'CXF-FC' };

async function issueUnits(){
  const member_id = document.getElementById('ruMember').value || null;
  const report_id = document.getElementById('ruReport').value || null;
  const project_label = document.getElementById('ruLabel').value.trim();
  const contract_code = document.getElementById('ruCode').value;
  const vintage = document.getElementById('ruVintage').value.trim();
  const quantity_tco2e = parseFloat(document.getElementById('ruQty').value);
  if (!member_id) return alert('Select the owning member.');
  if (!report_id) return alert('Select the validated report backing this batch — issuance without a validated report is not allowed (Registry Rules §2).');
  if (!project_label || !quantity_tco2e || quantity_tco2e <= 0) return alert('Fill in the public project label and a valid quantity.');
  const rpt = ISSUABLE_REPORTS.find(x => x.id === report_id);
  if (rpt && quantity_tco2e > Number(rpt.computed_tco2e) + 0.001) return alert('Quantity (' + quantity_tco2e + ') exceeds the validated report quantity (' + rpt.computed_tco2e + ' tCO₂e). A batch cannot exceed its evidence.');
  // one report → at most one batch (re-check live, Registry Rules §8)
  const { data: dup } = await db.from('registry_units').select('serial').eq('report_id', report_id).limit(1);
  if (dup && dup.length) return alert('Report already backs batch ' + dup[0].serial + ' — one report can back only one batch.');
  const serial = await nextBatchSerial();
  if (!confirm('Issue ' + serial + ' — ' + quantity_tco2e.toLocaleString() + ' tCO₂e (' + contract_code + ', ' + (vintage || 'no vintage') + ') for "' + project_label + '"?\n\nBacked by validated report ' + (rpt ? rpt.period : report_id) + '. Serial, label, vintage, quantity and status become PUBLIC on /registry.html.')) return;
  let { error } = await db.from('registry_units').insert({ serial, member_id, project_label, contract_code, vintage, quantity_tco2e, report_id });
  if (error && /load failed|failed to fetch|network/i.test(error.message)) {
    await new Promise(r => setTimeout(r, 1200));
    ({ error } = await db.from('registry_units').insert({ serial, member_id, project_label, contract_code, vintage, quantity_tco2e, report_id }));
  }
  if (error) return alert('Error: ' + error.message + (error.message.includes('registry_units') ? ' — did you run schema-registry.sql?' : ''));
  audit('units_issued', serial + ' · ' + quantity_tco2e + ' tCO₂e · ' + project_label + ' · report ' + report_id);
  const { data: m } = await db.from('members').select('email, contact_name, company').eq('id', member_id).maybeSingle();
  if (m) await notifyMember('units_issued', m.email, {
    name: m.contact_name, company: m.company, serial, code: contract_code,
    vintage, qty: quantity_tco2e.toLocaleString(), label: project_label
  });
  ['ruLabel','ruVintage','ruQty'].forEach(i => document.getElementById(i).value = '');
  document.getElementById('ruReport').innerHTML = '<option value="">— validated report (required) —</option>';
  loadIssuableReports();
  if (confirm('Issued ' + serial + ' — now public at /registry.html. The member was emailed their Statement of Issuance link.\n\nOpen the printable Statement of Issuance now?'))
    window.open('/portal/statement.html?serial=' + encodeURIComponent(serial), '_blank');
  loadRegistry();
}

          ${u.status === 'transferred' ? `<button class="act ghost" onclick="transferConfirmation('${esc(u.serial)}')">Confirmation</button>` : ''}

          ${['issued','listed'].includes(u.status) ? `<button class="act ghost" onclick="splitUnits('${u.id}')">Split</button>` : ''}

async function revokeUnits(id, serial){
  const { data: u } = await db.from('registry_units').select('*').eq('id', id).maybeSingle();
  if (!u) return;
  const wasRetired = u.status === 'retired';
  const reason = prompt('PUBLIC revocation reason for ' + serial + ' (shown on /registry.html):' + (wasRetired ? '\n\nThis batch is RETIRED — revoking will also mark certificate ' + u.certificate_serial + ' as revoked at /verify.' : ''), '');
  if (reason === null || !reason.trim()) return alert('A public reason is required — Registry Rules §5.');
  const note = (wasRetired ? 'Previously retired — certificate ' + u.certificate_serial + ' invalidated. ' : '') + reason.trim();
  const { error } = await db.from('registry_units').update({ status: 'revoked', status_note: note }).eq('id', id);
  if (error) return alert('Error: ' + error.message);
  if (wasRetired && u.certificate_serial) {
    const { error: ce } = await db.from('certificates').update({ status: 'revoked' }).eq('serial', u.certificate_serial);
    if (ce) alert('Batch revoked, but certificate update failed: ' + ce.message + ' — revoke certificate ' + u.certificate_serial + ' manually.');
  }
  audit('units_revoked', serial + ' · ' + note); loadRegistry(); if (wasRetired) loadCertificates();
}
async function splitUnits(id){
  const { data: u } = await db.from('registry_units').select('*').eq('id', id).maybeSingle();
  if (!u) return;
  if (u.serial.split('-').length > 4) return alert('Child batches cannot be split again in this pilot — retire or transfer them whole.');
  const input = prompt('Split ' + u.serial + ' (' + Number(u.quantity_tco2e).toLocaleString() + ' tCO₂e).\nEnter child quantities separated by commas — they must sum exactly to the parent (e.g. "2500, 3000, 4500"):', '');
  if (input === null) return;
  const parts = input.split(',').map(s => parseFloat(s.trim())).filter(n => !isNaN(n));
  if (parts.length < 2) return alert('Enter at least two quantities.');
  if (parts.some(n => n <= 0)) return alert('All quantities must be positive.');
  const sum = parts.reduce((a,b) => a + b, 0);
  if (Math.abs(sum - Number(u.quantity_tco2e)) > 0.001) return alert('Quantities sum to ' + sum.toLocaleString() + ' — they must equal the parent quantity of ' + Number(u.quantity_tco2e).toLocaleString() + '.');
  const letters = 'ABCDEFGHIJ';
  const children = parts.map((q, i) => ({
    serial: u.serial + '-' + letters[i], member_id: u.member_id, project_label: u.project_label,
    contract_code: u.contract_code, vintage: u.vintage, quantity_tco2e: q, report_id: u.report_id,
    status: 'issued', status_note: 'Child of ' + u.serial
  }));
  const names = children.map(c => c.serial.slice(-1) + ' = ' + c.quantity_tco2e.toLocaleString()).join(', ');
  if (!confirm('Split ' + u.serial + ' into ' + children.length + ' child batches (' + names + ' tCO₂e)?\n\nThe parent becomes status "split" (public); children appear as newly issued batches.')) return;
  let { error } = await db.from('registry_units').insert(children);
  if (error && /load failed|failed to fetch|network/i.test(error.message)) {
    await new Promise(r => setTimeout(r, 1200));
    ({ error } = await db.from('registry_units').insert(children));
  }
  if (error) return alert('Error inserting children: ' + error.message);
  ({ error } = await db.from('registry_units').update({ status: 'split', status_note: 'Split into ' + children.map(c => c.serial).join(', ') }).eq('id', id));
  if (error) return alert('Children created, but parent update failed: ' + error.message);

  loadRegistry();
}

/* ---------- Backup ---------- */
const BK_TABLES = ['members','member_notes','reports','documents','listings','cxf_projects','rfqs','certificates','price_history','newsletter_subscribers','audit_log'];
function backupReminder(){
  const last = localStorage.getItem('cxf_last_backup');
  const days = last ? Math.floor((Date.now() - Number(last)) / 86400000) : null;
  const el = document.getElementById('bkReminder');
  if (days === null) el.textContent = '⚠ No backup recorded yet on this device — download one now.';
  else if (days >= 7) el.textContent = '⚠ Last backup was ' + days + ' days ago — time for a fresh one.';
  else el.textContent = '';
}
async function downloadBackup(){
  const btn = document.getElementById('bkBtn'), st = document.getElementById('bkStatus');
  btn.disabled = true; st.textContent = 'Exporting…';
  try {
    const backup = { exported_at: new Date().toISOString(), exported_by: USER.email, tables: {} };
    for (const t of BK_TABLES) {
      const { data, error } = await db.from(t).select('*').limit(10000);
      backup.tables[t] = error ? { error: error.message } : data;
      st.textContent = 'Exporting… ' + t + ' (' + (Array.isArray(backup.tables[t]) ? backup.tables[t].length : '!') + ')';
    }
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'cxf-backup-' + new Date().toISOString().slice(0,10) + '.json';
    a.click(); URL.revokeObjectURL(a.href);
    localStorage.setItem('cxf_last_backup', String(Date.now()));
    backupReminder();
    const counts = BK_TABLES.map(t => t + ':' + (Array.isArray(backup.tables[t]) ? backup.tables[t].length : 'ERR')).join(' · ');
    st.textContent = '✓ Saved to Downloads — ' + counts;
    audit('backup_downloaded', counts);
  } catch(e) { st.textContent = ''; alert('Backup failed: ' + e.message); }
  btn.disabled = false;
}

async function capturePriceSnapshot(){

// New desk marks just archived → offer a one-click prefilled price alert
async function offerPriceAlert(p){
  const { data: prev } = await db.from('price_history').select('date, prices').lt('date', p.lastUpdated).order('date',{ascending:false}).limit(1);

    return label + ': $' + Number(v).toFixed(2) + '/tCO2e' + chg;
  }).join('\n');

  banner.innerHTML = `<span>📈 <b>New desk marks archived (${esc(p.lastUpdated)}).</b> Want to notify subscribers?</span>
    <span><button class="act ok" id="paBtn">Prefill price alert</button>
    <button class="act ghost" onclick="this.closest('div[style]').remove()">Dismiss</button></span>`;
  document.getElementById('app').prepend(banner);
  document.getElementById('paBtn').onclick = () => {
    document.getElementById('nlSubject').value = 'CXF Price Update — ' + p.lastUpdated;
    document.getElementById('nlBody').value =
`The CarbonXFuture desk has updated its indicative marks (${p.lastUpdated}):

${lines}

Full history, chart and CSV: https://www.carbonxfuture.com/prices.html

Marks are indicative desk assessments, not exchange prices. Not financial advice.`;
    banner.remove();
    document.getElementById('c-news').scrollIntoView({behavior:'smooth'});
  };
}

async function subSetStatus(id, status, email){

async function subDelete(id, email){

async function addSubscriber(){
  const inp = document.getElementById('subAddEmail');

const SUB_STATES = ['launch_free','trial','active','past_due','canceled','exempt'];
async function setSubscription(id){
  const s = prompt('Subscription status — one of:\n' + SUB_STATES.join(' | '), 'active');
  if (s === null) return;
  const status = s.trim().toLowerCase();
  if (!SUB_STATES.includes(status)) return alert('Invalid value. Use one of: ' + SUB_STATES.join(', '));
  const note = prompt('Optional note (e.g. "Stripe sub started 2026-08-01"):', '') || '';
  const { error } = await db.from('members').update({ subscription_status: status, subscription_note: note }).eq('id', id);
  if (error) return alert('Error: ' + error.message + (error.message.includes('subscription') ? ' — did you run schema-subscriptions.sql?' : ''));
  audit('subscription_' + status, id + (note ? ' · ' + note : ''));
  loadMembers();
}
async function setStatus(id, status){
  if (!confirm('Set member status to "' + status + '"?')) return;
  const { data: m } = await db.from('members').select('email, contact_name, company').eq('id', id).single();
  const { error } = await db.from('members').update({ status }).eq('id', id);
  if (error) return alert('Error: ' + error.message);
  audit('member_status:' + status, id);
  let sent = null;
  if (m && status === 'approved') sent = await notifyMember('member_approved', m.email, { name: m.contact_name, company: m.company });
  if (m && status === 'rejected') sent = await notifyMember('member_rejected', m.email, { name: m.contact_name, company: m.company });
  if (sent) alert('Done — the member has been notified by email.');
  loadMembers();
}

async function validateReport(id){
  const { data: r, error: e1 } = await db.from('reports').select('*, members(company, email, contact_name)').eq('id', id).single();
  if (e1) return alert('Error: ' + e1.message);
  const priceStr = prompt('Validate ' + r.computed_tco2e + ' tCO₂e for "' + r.members.company + '".\nIndicative ask price per tCO₂e in USD (leave empty for "on request"):');
  if (priceStr === null) return;
  const price = priceStr.trim() === '' ? null : parseFloat(priceStr);
  const { error: e2 } = await db.from('reports').update({ status: 'validated' }).eq('id', id);
  if (e2) return alert('Error: ' + e2.message);
  const { error: e3 } = await db.from('listings').insert({
    member_id: r.member_id, report_id: r.id,
    name: r.members.company + ' — ' + (CXF_FACTORS[r.activity]?.label || r.activity),
    vintage: r.period.slice(0,4), volume: r.computed_tco2e, price,
    type: 'Waste oil'
  });
  if (e3) return alert('Report validated but listing failed: ' + e3.message);
  audit('validate_report+list', id);
  const sent = await notifyMember('report_validated', r.members.email, {
    name: r.members.contact_name, company: r.members.company,
    period: r.period, volume: r.computed_tco2e, price: price ? price.toFixed(2) : null
  });
  alert('Validated and published to the marketplace.' + (sent ? ' The member has been notified by email.' : ''));
  loadReports(); loadListings();
}
async function requestChanges(id){
  const note = prompt('What should the member fix / add?');
  if (note === null) return;
  const { data: r } = await db.from('reports').select('period, members(email, contact_name, company)').eq('id', id).single();
  const { error } = await db.from('reports').update({ status: 'changes_requested', admin_notes: note }).eq('id', id);
  if (error) return alert('Error: ' + error.message);
  audit('report_changes_requested', id);
  if (r) await notifyMember('report_changes', r.members.email, { name: r.members.contact_name, company: r.members.company, period: r.period, note });
  loadReports();
}
async function rejectReport(id){
  const note = prompt('Rejection reason (visible to the member):');
  if (note === null) return;
  const { data: r } = await db.from('reports').select('period, members(email, contact_name, company)').eq('id', id).single();
  const { error } = await db.from('reports').update({ status: 'rejected', admin_notes: note }).eq('id', id);
  if (error) return alert('Error: ' + error.message);
  audit('report_rejected', id);
  if (r) await notifyMember('report_rejected', r.members.email, { name: r.members.contact_name, company: r.members.company, period: r.period, note });
  loadReports();
}

/* ---------- Listings ---------- */
async function loadListings(){
  const el = document.getElementById('listings');
  const [{ data, error }, { data: projects }] = await Promise.all([
    db.from('listings').select('*, members(company)').order('validated_at',{ascending:false}),
    db.from('cxf_projects').select('*, members(company)').eq('status','published').not('annual_tco2e','is',null).order('created_at',{ascending:false})
  ]);
  if (error) { el.textContent = 'Error: ' + error.message; return; }
  let html = '';

  // 1. Desk-validated member listings (from validated reports)
  html += '<p class="muted" style="margin-bottom:6px;"><b>① Member listings</b> — from validated activity reports:</p>';
  if (!data.length) html += '<p class="muted" style="margin-bottom:12px;">None yet — validate a report to publish the first one.</p>';
  else html += `<table style="margin-bottom:14px;"><tr><th>Listing</th><th>Member</th><th>Vintage</th><th>Volume</th><th>Price</th><th>Status</th><th>Actions</th></tr>` +
    data.map(l => `<tr>
      <td><b>${esc(l.name)}</b></td><td>${esc(l.members?.company ?? '—')}</td>
      <td>${esc(l.vintage)}</td><td>${Number(l.volume).toLocaleString()} tCO₂e</td>
      <td>${l.price ? '$' + Number(l.price).toFixed(2) : 'on request'}</td>
      <td><span class="pill ${esc(l.status)}">${esc(l.status)}</span></td>
      <td>${l.status === 'published' ? `<button class="act ok" onclick="markSold('${l.id}')">Mark sold</button><button class="act ghost" onclick="withdrawListing('${l.id}')">Withdraw</button>` : ''}</td>
    </tr>`).join('') + '</table>';

  // 2. Project forward offers (cxf_projects with value fields) — also live in the marketplace
  html += '<p class="muted" style="margin-bottom:6px;"><b>② Project forward offers</b> — published projects with value fields (managed in the Public projects card below):</p>';
  if (!projects || !projects.length) html += '<p class="muted" style="margin-bottom:12px;">None live.</p>';
  else html += `<table style="margin-bottom:14px;"><tr><th>Project</th><th>Member</th><th>Vintages</th><th>Total volume</th><th>Price</th><th>Total value</th><th></th></tr>` +
    projects.map(p => { const tv = p.annual_tco2e * (p.price_usd||0) * (p.term_years||0); const tvol = p.annual_tco2e * (p.term_years||0); return `<tr>
      <td><b>${esc(p.name)}</b></td><td>${esc(p.members?.company ?? '—')}</td><td>${esc(p.vintages || '—')}</td>
      <td>${tvol ? tvol.toLocaleString() + ' tCO₂e' : '—'}</td>
      <td>${p.price_usd ? '$' + Number(p.price_usd).toFixed(2) : '—'}</td>
      <td>${tv ? '<b>$' + tv.toLocaleString('en-US',{maximumFractionDigits:0}) + '</b>' : '—'}</td>
      <td><button class="act ghost" onclick="withdrawProject('${p.id}')">Withdraw</button></td>
    </tr>`;}).join('') + '</table>';

  // 3. Static desk rows from listings.json (edited on GitHub)
  try {
    const lj = await (await fetch('/listings.json', {cache:'no-store'})).json();
    const rows = Array.isArray(lj.carbon) ? lj.carbon : [];
    html += '<p class="muted"><b>③ Static desk rows</b> — from <code>listings.json</code> (edit on GitHub): ' +
      (rows.length ? rows.map(r => esc(r.name)).join(' · ') : 'none') + '</p>';
  } catch(e) { html += '<p class="muted">③ Static desk rows: could not read listings.json.</p>'; }

  el.innerHTML = html;
}

function pjCalc(){
  const a = parseFloat(document.getElementById('pjAnnual').value) || 0;
  const p = parseFloat(document.getElementById('pjPrice').value) || 0;
  const y = parseInt(document.getElementById('pjYears').value) || 0;
  const total = a * p * y;
  document.getElementById('pjTotal').textContent = total > 0 ? '$' + total.toLocaleString('en-US', {maximumFractionDigits:0}) : '—';
  document.getElementById('pjTotalDetail').textContent = total > 0 ? `(${a.toLocaleString()} tCO₂e/yr × $${p} × ${y} yr = ${(a*y).toLocaleString()} tCO₂e total)` : '';
}

async function publishProject(){
  const name = document.getElementById('pjName').value.trim();
  if (!name) return alert('Please enter the project name.');
  const member_id = document.getElementById('pjMember').value || null;
  const country = document.getElementById('pjCountry').value.trim() || 'USA';
  const type = document.getElementById('pjType').value.trim() || 'Waste oil re-refining';
  const vintages = document.getElementById('pjVintages').value.trim();
  const size = document.getElementById('pjSize').value.trim();
  const annual_tco2e = parseFloat(document.getElementById('pjAnnual').value) || null;
  const price_usd = parseFloat(document.getElementById('pjPrice').value) || null;
  const term_years = parseInt(document.getElementById('pjYears').value) || null;
  const row = { member_id, name, country, type, vintages, size, annual_tco2e, price_usd, term_years };
  let { error } = await db.from('cxf_projects').insert(row);
  // Transient network failure (Safari "Load failed" / Chrome "Failed to fetch")
  // on the first request after idle — wait a moment and retry once automatically.
  if (error && /load failed|failed to fetch|network/i.test(error.message)) {
    await new Promise(r => setTimeout(r, 1200));
    ({ error } = await db.from('cxf_projects').insert(row));
  }
  if (error) return alert('Error: ' + error.message + (error.message.includes('annual_tco2e') ? ' — did you run schema-project-value.sql in Supabase?' : ''));
  audit('project_published', name);
  const totalValue = (annual_tco2e && price_usd && term_years) ? annual_tco2e * price_usd * term_years : null;
  // Email the member that their project is live
  if (member_id) {
    const { data: m } = await db.from('members').select('email, contact_name').eq('id', member_id).maybeSingle();
    if (m?.email) {
      await notifyMember('project_published', m.email, {
        name: m.contact_name, project: name,
        details: [type, country, vintages && ('Vintages ' + vintages), size,
          totalValue && ('Indicative total project value $' + totalValue.toLocaleString('en-US',{maximumFractionDigits:0}))].filter(Boolean).join(' · ')
      });
    }
  }
  document.getElementById('pjName').value = ''; document.getElementById('pjVintages').value = ''; document.getElementById('pjSize').value = '';
  document.getElementById('pjAnnual').value = ''; document.getElementById('pjPrice').value = ''; document.getElementById('pjYears').value = ''; pjCalc();
  alert('Published — live on the Project Explorer page' + (totalValue ? ' and in the marketplace as a forward offer.' : '.'));
  loadCxfProjects();
}
async function withdrawProject(id){
  if (!confirm('Withdraw this project from the public website?')) return;
  const { error } = await db.from('cxf_projects').update({ status: 'withdrawn' }).eq('id', id);
  if (error) return alert('Error: ' + error.message);
  audit('project_withdrawn', id); loadCxfProjects();
}

/* ---------- Newsletter ---------- */
async function loadSubscriberCount(){
  const { count, error } = await db.from('newsletter_subscribers').select('*', { count: 'exact', head: true }).eq('status','active');
  document.getElementById('nlCount').textContent = error ? '— (run schema-newsletter.sql?)' : count;
}
async function sendNewsletter(){
  const subject = document.getElementById('nlSubject').value.trim();
  const body = document.getElementById('nlBody').value.trim();
  const btn = document.getElementById('nlBtn');
  const st = document.getElementById('nlStatus');
  if (!subject || !body) return alert('Please fill in the subject and the newsletter text.');
  if (!confirm('Send this newsletter to ALL active subscribers now?')) return;
  btn.disabled = true; st.textContent = 'Sending…';
  try {
    const { data: s } = await db.auth.getSession();
    const res = await fetch('/api/newsletter', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + s.session.access_token },
      body: JSON.stringify({ subject, body })
    });
    const out = await res.json();
    if (!res.ok) throw new Error(out.error || ('HTTP ' + res.status));
    st.textContent = `✓ Sent to ${out.sent}/${out.total} subscribers` + (out.failed?.length ? ` — failed: ${out.failed.join(', ')}` : '');
    audit('newsletter_sent', subject + ' → ' + out.sent + ' subscribers');
  } catch(e) { st.textContent = ''; alert('Send failed: ' + e.message); }
  btn.disabled = false;
}

async function withdrawListing(id){
  if (!confirm('Withdraw this listing from the marketplace?')) return;
  const { error } = await db.from('listings').update({ status: 'withdrawn' }).eq('id', id);
  if (error) return alert('Error: ' + error.message);
  audit('listing_withdrawn', id); loadListings();
}
